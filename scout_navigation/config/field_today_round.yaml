/**:
  ros__parameters:
    # Line 1 out and back in one run, starting from the near end. The surveyed corner is MGA2020 zone 55 E 320451.662 N 5814589.031, which is
    # -37.79844180, 144.96064559 (experiments/mga_to_geographic.py). With no corrections the
    # receiver reads 2.6 m northeast of it, so the line is translated onto what the receiver says
    # rather than leaving the rover 2.6 m off its own line from the first metre. Bearing and
    # length are untouched, so this is a rigid shift: the far end moves with it.
    origin_latitude: -37.79843457
    origin_longitude: 144.96067460
    # Direction of the lines, radians anticlockwise from true east, to the surveyed end point
    # MGA E 320409.619 N 5814594.319, which is 42.374 m away on a bearing of +171.581 deg
    grid_bearing: 2.994651
    grid_length: 42.374
    # One line only: the two surveyed points are its ends. width = (lines - 1) * spacing
    grid_width: 0.0
    line_spacing: 5.0
    # Lines are laid on the coordinates above, not on where the rover happens to start
    anchor_to_origin: true
    cruise_speed: 0.9
    # No IMU on the rover today: yaw rate comes from the chassis feedback, GNSS still required
    dead_reckoning: true
    # This RPLIDAR S2L reads its zero bearing aft, so every return sat 180 deg out until measured
    lidar_yaw: 3.141593
    # Only the forward sector is trusted on the real rover: +/-30 deg about the car's nose,
    # applied after lidar_yaw. Note this blinds swing_clear, which needs the full circle.
    obstacle_sector: 0.523599
    # Planning only ever sees what the sector and this reach allow, so it must be far enough
    # ahead for a ramp: sqrt(6 D v^2 / a) is 2.7 m for a 1.5 m shift at 0.9 m/s
    obstacle_range: 10.0
    # No corrections are reaching the receiver: GGA quality reads 1, standalone, not the 4 of an
    # RTK fix. survey.yaml's 0.02 is the ZED-F9P's RTK figure and would have the filter chase
    # metre-scale noise as though it were motion.
    gnss_noise: 0.8
    # The lever arm turns position innovation into yaw at about 1.9 rad per metre here, so a
    # standalone receiver wandering a metre swung the stationary heading 64 deg in 20 s. Zero it
    # until corrections are arriving; the 0.30 m antenna offset costs far less than that.
    gnss_offset: 0.0
    # No alignment run: the rover is parked on the line already facing along it, and with
    # initial_turn left at zero that heading is simply grid_bearing. Nothing measures it, so
    # however far the parking is off is the error the whole line starts with.
    skip_alignment: true
    # Out and back in one run: down the line, spot turn, and back to where it started
    return_pass: true
