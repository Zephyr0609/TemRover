/**:
  ros__parameters:
    # Line 1 start, MGA2020 zone 55 E 320451.662 N 5814589.031 (experiments/mga_to_geographic.py)
    origin_latitude: -37.79844180
    origin_longitude: 144.96064559
    # Direction of the lines, radians anticlockwise from true east, to the surveyed end point
    # MGA E 320409.619 N 5814594.319, which is 42.374 m away on a bearing of +171.581 deg
    grid_bearing: 2.994651
    grid_length: 42.374
    # One line only: the two surveyed points are its ends. width = (lines - 1) * spacing
    grid_width: 0.0
    line_spacing: 5.0
    # Lines are laid on the coordinates above, not on where the rover happens to start
    anchor_to_origin: true
    cruise_speed: 0.9
    # No IMU on the rover today: yaw rate comes from the chassis feedback, GNSS still required
    dead_reckoning: true
    # This RPLIDAR S2L reads its zero bearing aft, so every return sat 180 deg out until measured
    lidar_yaw: 3.141593
