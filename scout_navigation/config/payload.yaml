/**:
  ros__parameters:
    # Tx and Rx carts in tow: the Rx cart's rear wheels sit 7.76 m behind base_link (CAD), body beyond
    towed_length: 8.5
    # Each PVC link is two rigid V frames pinned at its midpoint, so both hitches are off-axle:
    # pivot distance behind the towing unit's axle (rover centre, then Tx axle) and pivot to the towed axle.
    # Front wheels are casters, so a cart's axle is its fixed rear pair
    hitch_offsets: [1.422, 1.859]
    trailer_lengths: [1.972, 2.386]
    # A plain U, no swing out: half the 5 m line spacing; its far point 15 m past the line end
    # (12.5 m straight plus the radius), which also lets the Tx reach the end and straighten
    turn_radius: 2.5
    headland: 12.5
