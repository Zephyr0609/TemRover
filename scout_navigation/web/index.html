<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMRover Survey</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --border: #e3e6ea; --text: #1f2937; --muted: #6b7280;
    --blue: #1e63d6; --red: #d93025; --green: #188038; --amber: #e37400;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: grid; grid-template-rows: 56px 1fr;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: -.01em; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted);
    padding: 4px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #c9ccd1; }
  .pill.on i { background: var(--green); }
  #clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding: 0 20px 20px; min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); min-height: 0; }
  .left { display: grid; grid-template-rows: 1fr 240px; gap: 14px; min-height: 0; }
  #map { position: relative; overflow: hidden; }
  .plots { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 8px; padding: 10px 12px; overflow: hidden; }
  .plots canvas { min-width: 0; min-height: 0; }
  #map .k { position: absolute; top: 12px; left: 16px; }
  canvas { display: block; width: 100%; height: 100%; }
  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #camera img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 12px; background: #111; }
  .status { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
  .state { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; }
  .state i { width: 10px; height: 10px; border-radius: 50%; background: #c9ccd1; flex: none; }
  .state small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.2; }
  .v span { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 13px; cursor: pointer; color: #fff; }
  #start { background: var(--blue); }
  #start.pause { background: #e8ebef; color: var(--text); }
  #stop { background: var(--red); }
  #stop.resume { background: var(--green); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .left { grid-template-rows: 60vh 240px; }
  }
</style>
</head>
<body>
<header>
  <h1>TEMRover Survey</h1>
  <span class="pill" id="link"><i></i>link</span>
  <span class="pill" id="fix"><i></i>GNSS</span>
  <span id="clock"></span>
</header>
<main>
  <div class="left">
    <div class="card" id="map">
      <span class="k">Survey lines and Rover, Tx, Rx tracks · scroll to zoom, drag to pan, double-click to reset</span>
      <canvas id="mapCanvas"></canvas>
    </div>
    <div class="card plots">
      <canvas id="separationPlot"></canvas>
      <canvas id="offsetPlot"></canvas>
    </div>
  </div>
  <aside>
    <div class="card" id="camera"><img id="video" alt=""></div>
    <div class="card status">
      <div class="state"><i id="stateDot"></i><span id="stateText">No link</span><small id="modeText"></small></div>
      <div class="grid">
        <div><div class="k">Line</div><div class="v" id="line">—</div></div>
        <div><div class="k">Speed</div><div class="v" id="speed">—<span>m/s</span></div></div>
        <div><div class="k">Cross-track</div><div class="v" id="cross">—<span>m</span></div></div>
        <div><div class="k">Heading</div><div class="v" id="heading">—<span>°</span></div></div>
      </div>
      <div class="buttons">
        <button id="start">Start survey</button>
        <button id="stop">Emergency stop</button>
      </div>
    </div>
  </aside>
</main>
<script src="roslib.min.js"></script>
<script>
const host = location.hostname || 'localhost';
const ros = new ROSLIB.Ros({ url: `ws://${host}:9090` });
document.getElementById('video').src = `http://${host}:8080/stream?topic=/front_camera/image&type=mjpeg&quality=60`;

const OBSTACLE_CELL = 0.1;
// The navigator decides on the latest scan only; the page holds returns 3 s so a sparse scan stays readable
const OBSTACLE_MEMORY_MS = 3000;
const LIDAR_OFFSET = 0.34;
// Scout 2.0 (scout_v2.xacro) and the Tx/Rx carts (temrover_carts.xacro), metres in base_link frame
const ROVER = { body: [0.925, 0.38], wheel: [0.329, 0.117], wheels: [[0.249, 0.292], [0.249, -0.292], [-0.249, 0.292], [-0.249, -0.292]],
                lidar: 0.34, antenna: -0.30, tow: -0.47 };
// Each PVC link is pinned at its midpoint. reach: pivot to cart centre; axle: pivot to the fixed rear axle (front wheels are casters);
// hitch: cart front where its V frame starts; tow: where the next V frame leaves this cart
const CARTS = [
  { reach: 1.272, axle: 1.972, hitch: 0.32, tow: -0.923, wheel: [0.26, 0.096], wheels: [[0.1, 0.3], [0.1, -0.3], [-0.7, 0.3], [-0.7, -0.3]] },
  { reach: 2.216, axle: 2.386, hitch: 0.58, wheel: [0.26, 0.096], wheels: [[0.33, 0], [-0.17, 0.25], [-0.17, -0.25]] },
];
const PIVOTS = [0.952, 1.636];
const CART_BODY = [1.0, 0.6];
const view = { zoom: 1, cx: 0, cy: 0 };
// Tx and Rx cart centres as the cart model places them, sampled along the rover's travel
const PLOT_WINDOW = 60;
const PLOT_STEP = 1.0;
const STRAIGHT_SEPARATION = -CARTS[0].tow + PIVOTS[1] + CARTS[1].reach;
const TRACK_SPACING = 0.2;
const TRACK_COLOURS = ['#ff7f0e', '#9467bd'];
const trace = { travelled: 0, sampledAt: -Infinity, last: null, samples: [], tracks: [[], []], replayed: false };
const state = { lines: [], plan: [], route: [], pose: null, scan: [], obstacles: new Map(), status: null };

const topic = (name, type, throttle) => new ROSLIB.Topic({ ros, name, messageType: type, throttle_rate: throttle || 0 });
const modeTopic = topic('/survey_mode', 'std_msgs/String');
const stopTopic = topic('/emergency_stop', 'std_msgs/Bool');
const setPill = (id, on) => document.getElementById(id).classList.toggle('on', on);
ros.on('connection', () => setPill('link', true));
ros.on('close', () => setPill('link', false));
ros.on('error', () => setPill('link', false));

topic('/survey_lines', 'nav_msgs/Path').subscribe(m => {
  // A new set of lines means a new run: what was seen before belongs to the old heading estimate
  state.obstacles.clear();
  const points = m.poses.map(p => [p.pose.position.x, p.pose.position.y]);
  state.lines = [];
  for (let i = 0; i + 1 < points.length; i += 2) state.lines.push({ a: points[i], b: points[i + 1] });
  Object.assign(trace, { travelled: 0, sampledAt: -Infinity, last: null, samples: [], tracks: [[], []], replayed: false });
});
// The route the rover drives: each line run past its ends, joined by the turns
topic('/survey_path', 'nav_msgs/Path').subscribe(m => {
  state.plan = m.poses.map(p => [p.pose.position.x, p.pose.position.y]);
});
topic('/driven_route', 'nav_msgs/Path').subscribe(m => {
  state.route = m.poses.map(p => [p.pose.position.x, p.pose.position.y]);
  if (!trace.replayed) replayRoute(state.route);
});
topic('/estimated_pose', 'geometry_msgs/PoseStamped', 50).subscribe(m => {
  const q = m.pose.orientation;
  state.pose = { x: m.pose.position.x, y: m.pose.position.y, yaw: 2 * Math.atan2(q.z, q.w) };
});
topic('/scan', 'sensor_msgs/LaserScan', 200).subscribe(m => {
  state.scan = [];
  if (!state.pose) return;
  const c = Math.cos(state.pose.yaw), s = Math.sin(state.pose.yaw);
  // The navigator owns the mounting angle; the page takes it from the status message
  const mounting = (state.status && state.status.lidar_yaw) || 0;
  for (let i = 0; i < m.ranges.length; i += 3) {
    const r = m.ranges[i];
    if (!(r > m.range_min && r < 12.0)) continue;
    const a = m.angle_min + i * m.angle_increment + mounting;
    const lx = LIDAR_OFFSET + r * Math.cos(a), ly = r * Math.sin(a);
    state.scan.push([state.pose.x + c * lx - s * ly, state.pose.y + s * lx + c * ly]);
  }
});
topic('/obstacle_points', 'sensor_msgs/PointCloud2', 200).subscribe(m => {
  const bytes = Uint8Array.from(atob(m.data), ch => ch.charCodeAt(0));
  const view = new DataView(bytes.buffer);
  for (let offset = 0; offset + 8 <= bytes.length; offset += m.point_step) {
    const x = view.getFloat32(offset, true), y = view.getFloat32(offset + 4, true);
    state.obstacles.set(`${Math.round(x / OBSTACLE_CELL)},${Math.round(y / OBSTACLE_CELL)}`, [x, y, Date.now()]);
  }
});
topic('/gps/fix', 'sensor_msgs/NavSatFix', 1000).subscribe(m => setPill('fix', m.status.status >= 0));
topic('/survey_status', 'std_msgs/String', 100).subscribe(m => { state.status = JSON.parse(m.data); renderStatus(); });

document.getElementById('start').onclick = () => {
  const running = state.status && state.status.mode === 'autonomous';
  modeTopic.publish(new ROSLIB.Message({ data: running ? 'idle' : 'autonomous' }));
};
document.getElementById('stop').onclick = () => {
  stopTopic.publish(new ROSLIB.Message({ data: !(state.status && state.status.emergency_stop) }));
};

const STATE_COLOUR = { SURVEYING: 'var(--green)', TURNING: 'var(--green)', HEADLAND: 'var(--green)', COMPLETE: 'var(--blue)',
                       HOLDING: 'var(--amber)', WAITING_FOR_FIX: 'var(--amber)', LOST: 'var(--red)', STOPPED: 'var(--red)' };
function renderStatus() {
  const s = state.status;
  const label = s.emergency_stop ? 'Emergency stop'
    : s.waiting_at_line_start ? `Ready at line ${s.line}`
    : s.state.charAt(0) + s.state.slice(1).toLowerCase().replace(/_/g, ' ');
  document.getElementById('stateText').textContent = label;
  document.getElementById('stateDot').style.background = s.emergency_stop ? 'var(--red)'
    : s.waiting_at_line_start ? 'var(--amber)' : STATE_COLOUR[s.state];
  document.getElementById('modeText').textContent = s.waiting_at_line_start ? '· press Start when acquisition runs' : `· ${s.mode}`;
  const put = (id, text) => { document.getElementById(id).firstChild.textContent = text; };
  put('line', `${s.line} / ${s.lines}`);
  put('speed', s.speed.toFixed(2));
  const signed = (value, digits) => (value < 0 ? '−' : '+') + Math.abs(value).toFixed(digits);
  put('cross', signed(s.cross_track, 2));
  put('heading', signed(s.heading, 0));
  const start = document.getElementById('start');
  start.textContent = s.mode === 'autonomous' ? 'Pause' : s.waiting_at_line_start ? `Start line ${s.line}` : 'Start survey';
  start.classList.toggle('pause', s.mode === 'autonomous');
  const stop = document.getElementById('stop');
  stop.textContent = s.emergency_stop ? 'Resume' : 'Emergency stop';
  stop.classList.toggle('resume', s.emergency_stop);
}

const canvas = document.getElementById('mapCanvas'), ctx = canvas.getContext('2d');
const MARGIN = { left: 50, right: 18, top: 40, bottom: 40 };
let frame = null;

// Wheel zooms about the cursor, drag pans, double-click returns to the fitted view
canvas.addEventListener('wheel', e => {
  if (!frame) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const px = e.offsetX - frame.left - frame.spanX / 2, py = e.offsetY - frame.top - frame.spanY / 2;
  view.cx += px / frame.scale * (1 - 1 / factor);
  view.cy -= py / frame.scale * (1 - 1 / factor);
  view.zoom = Math.min(400, Math.max(1, view.zoom * factor));
}, { passive: false });
let dragging = null;
canvas.addEventListener('pointerdown', e => { dragging = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging || !frame) return;
  view.cx -= (e.clientX - dragging[0]) / frame.scale;
  view.cy += (e.clientY - dragging[1]) / frame.scale;
  dragging = [e.clientX, e.clientY];
});
canvas.addEventListener('pointerup', () => { dragging = null; });
canvas.addEventListener('dblclick', () => { view.zoom = 1; view.cx = 0; view.cy = 0; });
const FONT = '11px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

function bounds() {
  const points = state.lines.flatMap(l => [l.a, l.b]).concat(state.plan, state.route);
  if (!points.length) {
    const [w, l] = state.status ? state.status.extent : [50, 50];
    return { minX: -3, maxX: l + 3, minY: -3, maxY: w + 3 };
  }
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  return { minX: Math.min(...xs) - 3, maxX: Math.max(...xs) + 3, minY: Math.min(...ys) - 3, maxY: Math.max(...ys) + 3 };
}

function drawVehicle(X, Y, scale, x, y, heading, body, wheel, wheels, extra) {
  ctx.save(); ctx.translate(X(x), Y(y)); ctx.rotate(-heading); ctx.scale(scale, scale);
  ctx.fillStyle = '#1f2937';
  for (const [wx, wy] of wheels) ctx.fillRect(wx - wheel[0] / 2, wy - wheel[1] / 2, wheel[0], wheel[1]);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 0.03;
  ctx.fillRect(-body[0] / 2, -body[1] / 2, body[0], body[1]); ctx.strokeRect(-body[0] / 2, -body[1] / 2, body[0], body[1]);
  if (extra) extra();
  ctx.restore();
}

function drawRover(X, Y, scale) {
  const { x, y, yaw } = state.pose;
  drawVehicle(X, Y, scale, x, y, yaw, ROVER.body, ROVER.wheel, ROVER.wheels, () => {
    ctx.fillStyle = '#d93025'; ctx.fillRect(ROVER.body[0] / 2 - 0.12, -0.15, 0.12, 0.3);
    ctx.fillStyle = '#1e63d6'; ctx.beginPath(); ctx.arc(ROVER.lidar, 0, 0.04, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#188038'; ctx.fillRect(ROVER.antenna - 0.04, -0.04, 0.08, 0.08);
  });
}

function drawArrow(X, Y, a, b, size) {
  const angle = Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
  ctx.save(); ctx.translate(X((a[0] + b[0]) / 2), Y((a[1] + b[1]) / 2)); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size, size * 0.7); ctx.lineTo(-size * 0.4, 0); ctx.lineTo(-size, -size * 0.7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Each cart yaws about the midpoint pivot of its PVC link so that its axle follows the pivot's motion
const train = { previous: null, headings: null, links: [] };
const along = (point, heading, distance) => [point[0] + distance * Math.cos(heading), point[1] + distance * Math.sin(heading)];

function updateTrain(x, y, yaw) {
  let tow = along([x, y], yaw, ROVER.tow), towHeading = yaw;
  if (!train.headings) train.headings = CARTS.map(() => yaw);
  const pivots = [];
  train.links = [];
  CARTS.forEach((cart, i) => {
    const pivot = along(tow, towHeading, -PIVOTS[i]);
    if (train.previous) {
      const [dx, dy] = [pivot[0] - train.previous[i][0], pivot[1] - train.previous[i][1]], step = Math.hypot(dx, dy);
      if (step > 1e-4) train.headings[i] += step / cart.axle * Math.sin(Math.atan2(dy, dx) - train.headings[i]);
    }
    pivots.push(pivot);
    const heading = train.headings[i];
    cart.pose = [...along(pivot, heading, -cart.reach), heading];
    train.links.push([tow, pivot, along(cart.pose, heading, cart.hitch)]);
    if (cart.tow !== undefined) [tow, towHeading] = [along(cart.pose, heading, cart.tow), heading];
  });
  train.previous = pivots;
  recordTrace(x, y, yaw);
}

// A page opened mid-survey runs the cart model along the route driven so far, heading from point to point
function replayRoute(route) {
  Object.assign(train, { previous: null, headings: null, links: [] });
  Object.assign(trace, { travelled: 0, sampledAt: -Infinity, last: null, samples: [], tracks: [[], []], replayed: true });
  route.forEach((point, i) => {
    const before = route[Math.max(i - 1, 0)], after = route[Math.min(i + 1, route.length - 1)];
    if (route.length > 1) updateTrain(point[0], point[1], Math.atan2(after[1] - before[1], after[0] - before[0]));
  });
}

function recordTrace(x, y, yaw) {
  if (trace.last) trace.travelled += Math.hypot(x - trace.last[0], y - trace.last[1]);
  trace.last = [x, y];
  const [tx, rx] = CARTS.map(cart => cart.pose);
  // Cart tracks for the map, as the cart model places each cart's centre
  CARTS.forEach((cart, i) => {
    const track = trace.tracks[i], end = track[track.length - 1];
    if (!end || Math.hypot(cart.pose[0] - end[0], cart.pose[1] - end[1]) >= TRACK_SPACING) track.push([cart.pose[0], cart.pose[1]]);
  });
  if (trace.travelled - trace.sampledAt < PLOT_STEP) return;
  trace.sampledAt = trace.travelled;
  trace.samples.push({
    distance: trace.travelled,
    separation: Math.hypot(tx[0] - rx[0], tx[1] - rx[1]),
    // Sideways distance of the Tx from the rover's centreline, left positive
    offset: -(tx[0] - x) * Math.sin(yaw) + (tx[1] - y) * Math.cos(yaw),
  });
  while (trace.samples[0].distance < trace.travelled - PLOT_WINDOW) trace.samples.shift();
}

// Matplotlib-style line plot: tab:blue and tab:orange, light grid, dots on the measured series
const PLOT_COLOURS = { blue: '#1f77b4', orange: '#ff7f0e' };
function niceStep(span, count) {
  const raw = span / count, power = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(f => f * power).find(step => step >= raw);
}

function drawPlot(plot, title, ylabel, series, yRange) {
  const pc = plot.getContext('2d'), dpr = window.devicePixelRatio || 1, w = plot.clientWidth, h = plot.clientHeight;
  if (plot.width !== w * dpr || plot.height !== h * dpr) { plot.width = w * dpr; plot.height = h * dpr; }
  pc.setTransform(dpr, 0, 0, dpr, 0, 0);
  pc.fillStyle = '#ffffff'; pc.fillRect(0, 0, w, h);
  const box = { left: 58, right: w - 12, top: 28, bottom: h - 38 };
  const distances = trace.samples.map(sample => sample.distance);
  const x0 = distances.length ? distances[0] : 0, x1 = Math.max(x0 + PLOT_WINDOW / 6, distances.length ? distances[distances.length - 1] : 1);
  const X = d => box.left + (d - x0) / (x1 - x0) * (box.right - box.left);
  const Y = v => box.bottom - (v - yRange[0]) / (yRange[1] - yRange[0]) * (box.bottom - box.top);

  pc.font = FONT; pc.fillStyle = '#262626'; pc.strokeStyle = '#e6e6e6'; pc.lineWidth = 1;
  const xStep = niceStep(x1 - x0, 5), yStep = niceStep(yRange[1] - yRange[0], 4);
  pc.textAlign = 'center'; pc.textBaseline = 'top';
  for (let d = Math.ceil(x0 / xStep) * xStep; d <= x1 + 1e-9; d += xStep) {
    pc.beginPath(); pc.moveTo(X(d), box.top); pc.lineTo(X(d), box.bottom); pc.stroke();
    pc.fillText(Number(d.toFixed(1)), X(d), box.bottom + 5);
  }
  pc.textAlign = 'right'; pc.textBaseline = 'middle';
  for (let v = Math.ceil(yRange[0] / yStep) * yStep; v <= yRange[1] + 1e-9; v += yStep) {
    pc.beginPath(); pc.moveTo(box.left, Y(v)); pc.lineTo(box.right, Y(v)); pc.stroke();
    pc.fillText(Number(v.toFixed(2)), box.left - 6, Y(v));
  }
  pc.strokeStyle = '#262626'; pc.strokeRect(box.left, box.top, box.right - box.left, box.bottom - box.top);
  pc.textAlign = 'center'; pc.textBaseline = 'alphabetic';
  pc.font = '600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  pc.fillText(title, (box.left + box.right) / 2, 18);
  pc.font = FONT;
  pc.fillText('distance travelled (m)', (box.left + box.right) / 2, h - 6);
  pc.save(); pc.translate(13, (box.top + box.bottom) / 2); pc.rotate(-Math.PI / 2); pc.fillText(ylabel, 0, 0); pc.restore();

  pc.save(); pc.beginPath(); pc.rect(box.left, box.top, box.right - box.left, box.bottom - box.top); pc.clip();
  for (const { values, colour, dots } of series) {
    pc.strokeStyle = colour; pc.fillStyle = colour; pc.lineWidth = 1.8; pc.beginPath();
    values.forEach((v, i) => i ? pc.lineTo(X(distances[i]), Y(v)) : pc.moveTo(X(distances[i]), Y(v)));
    pc.stroke();
    if (dots) for (const [i, v] of values.entries()) { pc.beginPath(); pc.arc(X(distances[i]), Y(v), 2.6, 0, 2 * Math.PI); pc.fill(); }
  }
  pc.restore();

  pc.textAlign = 'left'; pc.textBaseline = 'middle';
  const legendWidth = 12 + Math.max(...series.map(({ label }) => pc.measureText(label).width)) + 34;
  const lx = box.right - legendWidth - 8, ly = box.top + 8;
  pc.fillStyle = 'rgba(255,255,255,0.9)'; pc.strokeStyle = '#cccccc';
  pc.fillRect(lx, ly, legendWidth, 18 * series.length + 6); pc.strokeRect(lx, ly, legendWidth, 18 * series.length + 6);
  series.forEach(({ label, colour, dots }, i) => {
    const yy = ly + 12 + 18 * i;
    pc.strokeStyle = colour; pc.fillStyle = colour; pc.lineWidth = 1.8;
    pc.beginPath(); pc.moveTo(lx + 8, yy); pc.lineTo(lx + 32, yy); pc.stroke();
    if (dots) { pc.beginPath(); pc.arc(lx + 20, yy, 2.6, 0, 2 * Math.PI); pc.fill(); }
    pc.fillStyle = '#262626'; pc.fillText(label, lx + 38, yy);
  });
}

function paddedRange(values, minimumSpan) {
  const low = Math.min(...values), high = Math.max(...values), middle = (low + high) / 2;
  const half = Math.max(high - low, minimumSpan) * 0.6;
  return [middle - half, middle + half];
}

function drawPlots() {
  const separation = trace.samples.map(sample => sample.separation);
  const offset = trace.samples.map(sample => sample.offset);
  const nominal = separation.map(() => STRAIGHT_SEPARATION);
  drawPlot(document.getElementById('separationPlot'), 'Tx–Rx separation', 'separation (m)', [
    { values: separation, colour: PLOT_COLOURS.blue, dots: true, label: 'Tx–Rx' },
    { values: nominal, colour: PLOT_COLOURS.orange, dots: false, label: 'straight train' },
  ], paddedRange(separation.concat(STRAIGHT_SEPARATION), 0.5));
  const reach = Math.max(0.5, ...offset.map(Math.abs)) * 1.2;
  drawPlot(document.getElementById('offsetPlot'), 'Rover–Tx offset', 'offset (m)', [
    { values: offset, colour: PLOT_COLOURS.blue, dots: true, label: 'Tx sideways of rover' },
    { values: offset.map(() => 0), colour: PLOT_COLOURS.orange, dots: false, label: 'on the centreline' },
  ], [-reach, reach]);
}

function drawTrain(X, Y, scale) {
  if (!(state.status && state.status.towed_length > 0)) return;
  updateTrain(state.pose.x, state.pose.y, state.pose.yaw);
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = Math.max(1, 0.04 * scale);
  for (const [tow, pivot, front] of train.links) {
    ctx.beginPath(); ctx.moveTo(X(tow[0]), Y(tow[1])); ctx.lineTo(X(pivot[0]), Y(pivot[1])); ctx.lineTo(X(front[0]), Y(front[1])); ctx.stroke();
    ctx.fillStyle = '#d93025'; ctx.beginPath(); ctx.arc(X(pivot[0]), Y(pivot[1]), Math.max(2, 0.06 * scale), 0, 2 * Math.PI); ctx.fill();
  }
  for (const cart of CARTS) drawVehicle(X, Y, scale, ...cart.pose, CART_BODY, cart.wheel, cart.wheels);
}

function draw() {
  const expired = Date.now() - OBSTACLE_MEMORY_MS;
  for (const [key, point] of state.obstacles) if (point[2] < expired) state.obstacles.delete(key);
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const fit = bounds();
  const left = MARGIN.left, top = MARGIN.top, spanX = w - MARGIN.left - MARGIN.right, spanY = h - MARGIN.top - MARGIN.bottom;
  const scale = Math.min(spanX / (fit.maxX - fit.minX), spanY / (fit.maxY - fit.minY)) * view.zoom;
  const cx = (fit.minX + fit.maxX) / 2 + view.cx, cy = (fit.minY + fit.maxY) / 2 + view.cy;
  const X = x => left + spanX / 2 + (x - cx) * scale, Y = y => top + spanY / 2 - (y - cy) * scale;
  const b = { minX: cx - spanX / 2 / scale, maxX: cx + spanX / 2 / scale, minY: cy - spanY / 2 / scale, maxY: cy + spanY / 2 / scale };
  frame = { left, top, spanX, spanY, scale, cx, cy };

  ctx.save(); ctx.beginPath(); ctx.rect(left, top, spanX, spanY); ctx.clip();
  const tick = [0.5, 1, 2, 5, 10, 20, 50, 100].find(step => step * scale >= 60) || 100;
  const minor = tick / 5;
  ctx.lineWidth = 1;
  for (let g = Math.ceil(b.minX / minor) * minor; g <= b.maxX; g += minor) {
    ctx.strokeStyle = Math.abs(g / tick - Math.round(g / tick)) > 1e-6 ? '#f1f3f5' : '#e3e6ea'; ctx.beginPath(); ctx.moveTo(X(g), top); ctx.lineTo(X(g), top + spanY); ctx.stroke();
  }
  for (let g = Math.ceil(b.minY / minor) * minor; g <= b.maxY; g += minor) {
    ctx.strokeStyle = Math.abs(g / tick - Math.round(g / tick)) > 1e-6 ? '#f1f3f5' : '#e3e6ea'; ctx.beginPath(); ctx.moveTo(left, Y(g)); ctx.lineTo(left + spanX, Y(g)); ctx.stroke();
  }

  const corridor = state.status ? state.status.corridor : 0.5;
  ctx.fillStyle = 'rgba(217, 48, 37, 0.12)'; ctx.beginPath();
  for (const [x, y] of state.obstacles.values()) { ctx.moveTo(X(x) + corridor * scale, Y(y)); ctx.arc(X(x), Y(y), corridor * scale, 0, 2 * Math.PI); }
  ctx.fill();
  ctx.fillStyle = '#374151';
  const cell = Math.max(2, OBSTACLE_CELL * scale);
  for (const [x, y] of state.obstacles.values()) ctx.fillRect(X(x) - cell / 2, Y(y) - cell / 2, cell, cell);

  ctx.strokeStyle = '#c3cfdd'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath();
  state.plan.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)));
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#9db4d0'; ctx.fillStyle = '#9db4d0'; ctx.lineWidth = 1.5;
  for (const { a, b: e } of state.lines) {
    ctx.beginPath(); ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(e[0]), Y(e[1])); ctx.stroke();
    drawArrow(X, Y, a, e, 5);
    // Line ends as surveyed: where the Tx starts and stops measuring
    for (const [x, y] of [a, e]) { ctx.beginPath(); ctx.arc(X(x), Y(y), 3, 0, 2 * Math.PI); ctx.fill(); }
  }

  ctx.fillStyle = 'rgba(24, 128, 56, 0.6)';
  for (const [x, y] of state.scan) ctx.fillRect(X(x) - 1, Y(y) - 1, 2, 2);

  if (state.route.length) {
    ctx.strokeStyle = '#1e63d6'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    state.route.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)));
    if (state.pose) ctx.lineTo(X(state.pose.x), Y(state.pose.y));
    ctx.stroke();
  }
  if (state.status && state.status.towed_length > 0) {
    trace.tracks.forEach((track, i) => {
      ctx.strokeStyle = TRACK_COLOURS[i]; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
      track.forEach(([x, y], j) => j ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)));
      ctx.stroke();
    });
  }
  if (state.pose) { drawTrain(X, Y, scale); drawRover(X, Y, scale); }
  ctx.restore();

  ctx.strokeStyle = '#cfd4da'; ctx.lineWidth = 1; ctx.strokeRect(left, top, spanX, spanY);
  ctx.fillStyle = '#6b7280'; ctx.font = FONT;
  const label = g => Number(g.toFixed(2));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let g = Math.ceil(b.minX / tick) * tick; g <= b.maxX; g += tick) ctx.fillText(label(g), X(g), top + spanY + 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let g = Math.ceil(b.minY / tick) * tick; g <= b.maxY; g += tick) ctx.fillText(label(g), left - 8, Y(g));
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('East (m)', left + spanX / 2, h - 8);
  ctx.save(); ctx.translate(14, top + spanY / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('North (m)', 0, 0); ctx.restore();

  const legend = [['#9db4d0', 'survey line'], ['#1e63d6', 'Rover'], [TRACK_COLOURS[0], 'Tx'], [TRACK_COLOURS[1], 'Rx']];
  const lw = 104, lh = 16 * legend.length + 10, lx = left + spanX - lw - 10, ly = top + 10;
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fillRect(lx, ly, lw, lh);
  ctx.strokeStyle = '#e3e6ea'; ctx.strokeRect(lx, ly, lw, lh);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  legend.forEach(([colour, label], i) => {
    ctx.fillStyle = colour; ctx.fillRect(lx + 10, ly + 10 + 16 * i, 14, 4);
    ctx.fillStyle = '#4b5563'; ctx.fillText(label, lx + 30, ly + 12 + 16 * i);
  });
}

setInterval(draw, 50);
setInterval(drawPlots, 250);
setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);
</script>
</body>
</html>
