<text x='710' y='60' text-anchor='middle' fill='#A93B26' font-size='12' font-weight='normal'>returns in one narrow cluster</text>
<circle cx='710' cy='170' r='9' fill='#10202C'/>
<text x='710' y='196' text-anchor='middle' fill='#5D7284' font-size='11' font-weight='normal'>rover</text>
<line x1='686' y1='142' x2='734' y2='142' stroke='#10202C' stroke-width='1.2' marker-start='url(#ar)' marker-end='url(#ar)'/>
<text x='710' y='230' text-anchor='middle' fill='#A93B26' font-size='13' font-weight='bold'>angular width &lt; 90°</text>
<text x='710' y='262' text-anchor='middle' fill='#5D7284' font-size='12' font-weight='normal'>→ classified as obstacle</text>
