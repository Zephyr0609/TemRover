<text x='180' y='230' text-anchor='middle' fill='#A93B26' font-size='13' font-weight='bold'>angular width &gt; 90°</text>
<text x='180' y='262' text-anchor='middle' fill='#5D7284' font-size='12' font-weight='normal'>→ classified as terrain</text>
<text x='560' y='26' text-anchor='start' fill='#5D7284' font-size='12' font-weight='bold'>B · Returns from an object → keep</text>
<path d='M 710 170 L 590 70 A 155 155 0 0 1 830 70 Z' fill='#D9EBF2' opacity='0.6'/>
