<text x='180' y='60' text-anchor='middle' fill='#A93B26' font-size='12' font-weight='normal'>returns form one wide band</text>
<circle cx='180' cy='170' r='9' fill='#10202C'/>
<text x='180' y='196' text-anchor='middle' fill='#5D7284' font-size='11' font-weight='normal'>rover</text>
