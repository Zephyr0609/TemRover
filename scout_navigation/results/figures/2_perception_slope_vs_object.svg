<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 290' width='1000' height='290' font-family='Helvetica, Arial, sans-serif' font-size='13'>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><polygon points='0,1 10,5 0,9' fill='#10202C'/></marker></defs>
<rect width='1000' height='290' fill='white'/>
<text x='30' y='26' text-anchor='start' fill='#5D7284' font-size='12' font-weight='bold'>A · Returns from a slope → discard</text>
<path d='M 180 170 L 60 70 A 155 155 0 0 1 300 70 Z' fill='#D9EBF2' opacity='0.6'/>
<text x='180' y='124' text-anchor='middle' fill='#5D7284' font-size='11' font-weight='normal'>scan field</text>
